version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: dosje_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dosje_db}
      POSTGRES_USER: ${POSTGRES_USER:-dosje_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dosje_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dosje_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dosje_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: dosje_web
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    container_name: dosje_celery_worker
    command: celery -A config worker -l info
    volumes:
      - .:/code
    env_file:
      - .env
    depends_on:
      - web
      - redis

  celery_beat:
    build: .
    container_name: dosje_celery_beat
    command: celery -A config beat -l info
    volumes:
      - .:/code
    env_file:
      - .env
    depends_on:
      - web
      - redis

  # ---- The services below are for later phases. Uncomment when you reach them. ----

